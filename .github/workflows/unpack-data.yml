name: Unpack data
on:
  push:
    paths: ['parts/*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip parts into repo root
        run: |
          shopt -s nullglob
          for z in parts/*.zip; do unzip -oq "$z"; done
          rm -rf parts
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack data"
          git push
